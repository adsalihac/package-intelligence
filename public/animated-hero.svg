<!-- Advanced Animated SVG Hero for Package Intelligence (No Background, No Title) -->
<svg width="400" height="200" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glow -->
  <ellipse cx="200" cy="160" rx="60" ry="16" fill="#38BDF8" opacity="0.18">
    <animate attributeName="opacity" values="0.18;0.35;0.18" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Box Base -->
  <g id="box-base">
    <rect x="150" y="110" width="100" height="50" rx="12" fill="#E0E7EF" stroke="#64748B" stroke-width="2"/>
  </g>
  <!-- Box Lid (Animated Open) -->
  <g id="box-lid">
    <rect x="150" y="90" width="100" height="28" rx="10" fill="#CBD5E1" stroke="#64748B" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 200 104" to="-25 200 104" dur="1.2s" begin="0s" fill="freeze" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- Data Elements Floating Out -->
  <!-- Chart Bar 1 -->
  <rect x="175" y="100" width="10" height="30" rx="3" fill="#FBBF24">
    <animate attributeName="y" values="100;60;100" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.3;0.7;1" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Chart Bar 2 -->
  <rect x="190" y="110" width="10" height="20" rx="3" fill="#34D399">
    <animate attributeName="y" values="110;70;110" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.3;0.7;1" dur="2.2s" begin="0.7s" repeatCount="indefinite"/>
  </rect>
  <!-- Chart Bar 3 -->
  <rect x="205" y="115" width="10" height="15" rx="3" fill="#6366F1">
    <animate attributeName="y" values="115;80;115" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.3;0.7;1" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
  <!-- Code Snippet -->
  <rect x="225" y="120" width="24" height="10" rx="2" fill="#38BDF8">
    <animate attributeName="y" values="120;85;120" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.3;0.7;1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
  </rect>
  <!-- Star Icon -->
  <polygon points="200,95 204,105 215,106 207,113 209,124 200,118 191,124 193,113 185,106 196,105" fill="#F59E42">
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2;0.7;1" dur="2.2s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="points" values="200,95 204,105 215,106 207,113 209,124 200,118 191,124 193,113 185,106 196,105;200,85 204,95 215,96 207,103 209,114 200,108 191,114 193,103 185,96 196,95;200,95 204,105 215,106 207,113 209,124 200,118 191,124 193,113 185,106 196,105" dur="2.2s" begin="1.3s" repeatCount="indefinite"/>
  </polygon>
  <!-- Sparkles -->
  <circle cx="170" cy="80" r="2" fill="#F472B6">
    <animate attributeName="r" values="2;5;2" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="70" r="1.5" fill="#F472B6">
    <animate attributeName="r" values="1.5;4;1.5" dur="1.2s" begin="1.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="1.2s" begin="1.7s" repeatCount="indefinite"/>
  </circle>
</svg>
